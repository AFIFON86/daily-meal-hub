
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b50">
  <title>Daily Meal Hub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #20342b;
    }
    header {
      background: #176b50;
      color: white;
      padding: 22px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 21px; margin: 0; }
    button, input { font: inherit; }
    .lang {
      background: white;
      color: #176b50;
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: bold;
    }
    main {
      max-width: 460px;
      margin: 35px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 24px;
      box-shadow: 0 3px 14px #0000000c;
      margin-bottom: 18px;
    }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 9px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd8d1;
      border-radius: 9px;
      margin-bottom: 18px;
    }
    .primary {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #176b50;
      color: white;
      font-weight: bold;
    }
    .order {
      border: 1px solid #dce6df;
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }
    .order h3 { margin: 0 0 8px; }
    .muted { color: #718078; font-size: 14px; }
    footer {
      text-align: center;
      color: #718078;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily Meal Hub</h1>
    <button class="lang" onclick="changeLanguage()">
      עברית
    </button>
  </header>

  <main>
    <section class="card">
      <h2 id="welcome">Добро пожаловать!</h2>
      <p id="description">Введите личный номер сотрудника</p>

      <label id="numberLabel" for="employeeNumber">
        Личный номер
      </label>
      <input
        id="employeeNumber"
        type="text"
        inputmode="numeric"
        placeholder="Введите номер"
      >

      <button class="primary" id="loginButton" disabled>
        Войти
      </button>
      <p class="muted" id="status">
        Подключение базы данных будет настроено позже.
      </p>
    </section>

    <section class="card">
      <h2 id="ordersTitle">Мои заказы</h2>

      <div class="order">
        <h3 id="orderOne">Заказ №1</h3>
        <p class="muted" id="orderOneDesc">
          Первый тип заказа
        </p>
      </div>

      <div class="order">
        <h3 id="orderTwo">Заказ №2</h3>
        <p class="muted" id="orderTwoDesc">
          Второй тип заказа
        </p>
      </div>
    </section>
  </main>

  <footer>Daily Meal Hub © 2026</footer>

  <script>
    let language = "ru";

    function changeLanguage() {
      language = language === "ru" ? "he" : "ru";
      const he = language === "he";

      document.documentElement.lang = language;
      document.documentElement.dir = he ? "rtl" : "ltr";

      document.querySelector(".lang").textContent =
        he ? "Русский" : "עברית";

      const translations = {
        welcome: he ? "ברוכים הבאים!" : "Добро пожаловать!",
        description: he ? "הזינו מספר עובד אישי" : "Введите личный номер сотрудника",
        numberLabel: he ? "מספר אישי" : "Личный номер",
        loginButton: he ? "כניסה" : "Войти",
        ordersTitle: he ? "ההזמנות שלי" : "Мои заказы",
        orderOne: he ? "הזמנה מספר 1" : "Заказ №1",
        orderTwo: he ? "הזמנה מספר 2" : "Заказ №2",
        orderOneDesc: he ? "סוג הזמנה ראשון" : "Первый тип заказа",
        orderTwoDesc: he ? "סוג הזמנה שני" : "Второй тип заказа",
        status: he ? "חיבור למסד הנתונים יוגדר בהמשך." : "Подключение базы данных будет настроено позже."
      };

      Object.keys(translations).forEach(id => {
        document.getElementById(id).textContent = translations[id];
      });

      document.getElementById("employeeNumber").placeholder =
        he ? "הזינו מספר" : "Введите номер";
    }
  </script>
</body>
</html>
